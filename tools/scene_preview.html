<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #EDE8E0; color: #222; }
  .bar { padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .bar select, .bar input, .bar button { font: inherit; padding: 4px 8px; }
  #wrap { position: relative; width: 1000px; height: 625px; margin: 0 16px 16px; background: #FBF8F3; box-shadow: 0 1px 8px rgba(0,0,0,.1); }
  #log { font: 12px ui-monospace, monospace; margin: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Plays any scene (v3.0) with sound. Open through python tools/dev_server.py: tools/scene_preview.html -->
<div class="bar">
  Stranger set <select id="sset"><option>X</option><option>Y</option></select>
  Scene set <select id="set"></select>
  Stranger name <select id="sname"></select>
  Voice <select id="voice"></select>
  Avatar name <input id="nm" value="Sam" size="10">
  <label><input type="checkbox" id="shownm" checked> show name text</label>
  <button id="play">▶ Play scene</button>
  <span>(Press SPACE to end a playing scene.)</span>
</div>
<div id="wrap"></div>
<div id="log"></div>
<link rel="stylesheet" href="../experiment/css/experiment.css">
<script src="../experiment/config.js"></script>
<script src="../experiment/js/util.js"></script>
<script src="../experiment/js/people.js"></script>
<script src="../experiment/js/objects.js"></script>
<script src="../experiment/js/names.js"></script>
<script src="../experiment/js/stimuli.js"></script>
<script src="../experiment/js/audio.js"></script>
<script src="../experiment/js/ui.js"></script>
<script src="../experiment/js/scene.js"></script>
<script>
(async function () {
  const base = '../experiment/', $ = (id) => document.getElementById(id);
  const names = SRL.names.allStrangerNames(), voices = SRL_CONFIG.VOICES.map((v) => v.id);
  names.forEach((n) => $('sname').add(new Option(n)));
  voices.forEach((v) => $('voice').add(new Option(v)));
  const avatar = Object.assign({}, SRL.people.NEUTRAL, { age: 'young', skinL: 0.35, skinU: 0.6, lid: 'mono', texture: 'straight', length: 'medium', hairStyle: 'bangs', hairColor: 0, glasses: 'round', shirt: 'navy' });
  const wrap = $('wrap'), log = $('log');
  let design = null;
  async function loadSet() {
    await SRL.stimuli.load(base, $('sset').value);
    const map = {}; SRL.stimuli.strangers().forEach((s, i) => (map[s.id] = names[2 * i]));
    design = SRL.stimuli.design(['word', 'identity', 'colour'], map);
    $('set').innerHTML = '';
    design.sets.forEach((s) => $('set').add(new Option(`${s.id} (${s.word}, ${s.incidental}, ${s.stranger.id})`, s.id)));
  }
  $('sset').onchange = loadSet;
  await loadSet();
  $('play').onclick = async () => {
    await SRL.audio.unlock();
    const voice = $('voice').value, sc = Object.assign({}, design.byId[$('set').value], { stranger_name: $('sname').value, presentation: 1 });
    log.textContent = 'loading audio…';
    await SRL.audio.preload(base, SRL.stimuli.voiceClipIds(voice, [sc.stranger_name]));
    log.textContent = 'playing…';
    const r = await SRL.scene.run(wrap, sc, { avatarSpec: avatar, avatarName: $('nm').value, voice, showName: $('shownm').checked,
      timing: Object.assign({}, SRL_CONFIG.TIMING, { ISI: 0 }), debug: false, auto: false });
    log.textContent = JSON.stringify(r, null, 1);
  };
})();
</script>
</body>
</html>
