<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Repeat-6 objects</title>
<style>
 body{font-family:system-ui,sans-serif;background:#FAF7F2;color:#222;margin:16px}
 h2{font-size:16px;margin:18px 0 6px} .row{display:flex;gap:10px;flex-wrap:wrap}
 .c{background:#fff;border:1px solid #e3ddd3;border-radius:8px;padding:6px;text-align:center;font-size:13px;width:130px}
 .c svg{width:118px;height:118px;display:block;margin:0 auto}
 .new{border:2px solid #2F5DA8} .note{font-size:12px;color:#666}
</style></head><body>
<h2>A. Recommended: kept 4 + cube drawing as <i>lufi</i> + blob drawing as <i>mavo</i></h2><div class="row" id="a"></div>
<h2>B. As in the spec: kept 4 + the drawings currently labelled lufi and mavo</h2><div class="row" id="b"></div>
<h2>Incidental: mug, vase + recommended lamp, clock, book, candle</h2><div class="row" id="i"></div>
<script src="../experiment/js/util.js"></script><script>window.SRL=window.SRL||{};</script>
<script src="../experiment/js/objects.js"></script>
<script>
const O = SRL.objects;
const cell = (id, label, cls, from) => `<div class="c ${cls||''}">${O.novelSvg(id)}<b>${label}</b><div class="note">${from||'&nbsp;'}</div></div>`;
const kept = ['bosa','daxa','tefo','gimu'].map(w => cell('obj_'+w, w));
document.getElementById('a').innerHTML = kept.join('') + cell('obj_zibu','lufi','new','drawing now “zibu”') + cell('obj_fiku','mavo','new','drawing now “fiku”');
document.getElementById('b').innerHTML = kept.join('') + cell('obj_lufi','lufi','new') + cell('obj_mavo','mavo','new');
document.getElementById('i').innerHTML = ['mug','vase','lamp','clock','book','candle'].map(t => `<div class="c">${O.incidentalSvg(t,'#0072B2')}<b>${t}</b></div>`).join('');
</script></body></html>
